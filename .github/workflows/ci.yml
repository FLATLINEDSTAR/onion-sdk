name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Verify formatting
        run: |
          go fmt ./... && git diff --quiet || (echo "go fmt needed" && exit 1)
      - name: Run vet
        run: go vet ./...
      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out
      - name: Build
        run: go build ./...
